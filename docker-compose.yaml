version: '3.8'

services:
  spletni-streznik:
    build: 
      context: .
      dockerfile_inline: |
        FROM php:apache
        
        # Namestitev Docker CLI (Popravljena pot, da je 'docker' neposredno v /usr/bin)
        RUN apt-get update && \
            apt-get install -y curl git && \
            curl -fsSL https://download.docker.com/linux/static/stable/x86_64/docker-24.0.7.tgz | tar zx -C /usr/bin/ --strip-components=1 docker/docker && \
            chmod +x /usr/bin/docker && \
            docker-php-ext-install pdo pdo_mysql && \
            rm -rf /var/lib/apt/lists/*

    restart: unless-stopped
    ports:
      - "8000:80"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./data/www:/var/www
    user: root
    # Dinamično dodajanje www-data v skupino, ki si lasti docker.sock na gostitelju
    command: >
      /bin/sh -c "
        DOCKER_GID=$$(stat -c '%g' /var/run/docker.sock);
        groupadd -g $$DOCKER_GID docker_host || true;
        usermod -a -G docker_host www-data;
        chown -R www-data:www-data /var/www;
        exec apache2-foreground
      "
    depends_on:
      - executor-build

  executor-build:
    image: executor
    build:
      context: .
      dockerfile: Dockerfile
    entrypoint: ["echo", "Splošna slika 'executor' je pripravljena."]

  mysql:
    hostname: podatkovna-baza
    image: mysql:latest
    environment:
      - MYSQL_ROOT_PASSWORD=root
    volumes:
      - ./data/mysql:/var/lib/mysql
    ports:
      - "3307:3306" 

  phpmyadmin:
    image: phpmyadmin/phpmyadmin:latest
    ports:
      - "8001:80"
    environment:
      PMA_HOST: podatkovna-baza